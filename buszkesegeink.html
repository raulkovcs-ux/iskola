<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Büszkeségeink – Zoltánfy István Iskola</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/site.css">
  <style>
    .spotlight-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      margin: 20px 0 40px;
    }
    .spotlight-card {
      border: 1px solid var(--gray-200);
      border-radius: 14px;
      padding: 24px;
      position: relative;
      overflow: hidden;
      background: var(--white);
      transition: box-shadow 0.18s, transform 0.18s;
    }
    .spotlight-card:hover { box-shadow: 0 8px 28px rgba(4,44,83,0.11); transform: translateY(-2px); }
    .spotlight-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; }
    .spotlight-card.gold::before { background: linear-gradient(90deg, var(--amber), #FAC775); }
    .spotlight-card.navy::before { background: linear-gradient(90deg, var(--navy), var(--navy-mid)); }
    .spotlight-card.teal::before { background: linear-gradient(90deg, var(--teal), #3db389); }
    .spotlight-icon { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; margin-bottom: 16px; }
    .spotlight-icon.gold { background: var(--amber-light); color: var(--amber-dark); }
    .spotlight-icon.navy { background: var(--navy-light); color: var(--navy-mid); }
    .spotlight-icon.teal { background: var(--teal-light); color: var(--teal); }
    .spotlight-icon .material-icons { font-size: 26px; }
    .spotlight-card h3 { font-family: var(--font-heading); font-size: 18px; font-weight: 600; color: var(--navy-dark); margin: 0 0 8px; }
    .spotlight-card p { font-size: 14px; color: var(--gray-600); line-height: 1.6; margin: 0; }
    .spotlight-badge { display: inline-block; margin-top: 12px; background: var(--amber-light); color: var(--amber-dark); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px; padding: 3px 10px; border-radius: 20px; }
    .spotlight-badge.navy { background: var(--navy-light); color: var(--navy-mid); }
    .spotlight-badge.teal { background: var(--teal-light); color: var(--teal); }
    .student-list { display: flex; flex-direction: column; gap: 12px; margin: 16px 0 40px; }
    .student-item { display: flex; align-items: flex-start; gap: 16px; background: var(--gray-50); border: 1px solid var(--gray-200); border-radius: 10px; padding: 16px 20px; }
    .student-avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--navy-light); display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--navy-mid); }
    .student-avatar .material-icons { font-size: 24px; }
    .student-item h4 { font-size: 15px; font-weight: 600; color: var(--navy-dark); margin: 0 0 4px; }
    .student-item p { font-size: 13px; color: var(--gray-600); margin: 0; line-height: 1.5; }
    .medal { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 20px; margin-top: 6px; margin-right: 4px; }
    .medal .material-icons { font-size: 13px; }
    .medal-gold   { background: var(--amber-light); color: var(--amber-dark); }
    .medal-silver { background: var(--gray-200); color: var(--gray-600); }
    .medal-bronze { background: #f5ece4; color: #8B5E3C; }
    @media (max-width: 600px) { .spotlight-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div id="site-topbar"></div>
  <div id="site-nav"></div>

  <div class="page-content">
    <div class="page-header">
      <div class="page-eyebrow">Zoltánfy István Iskola</div>
      <h1>Büszkeségeink</h1>
      <p class="lead">Kiemelkedő tanulóink, különleges programjaink és intézményünk értékei – mindaz, amire a legnagyobb örömmel tekintünk vissza.</p>
    </div>
    <div class="page-body">
      <h2>Amiben kiemelkedünk</h2>
      <div class="spotlight-grid" id="highlights-spotlights">
        <p style="color:var(--gray-500);font-style:italic;">Betöltés...</p>
      </div>

      <h2>Kiemelkedő tanulóink</h2>
      <div class="student-list" id="highlights-students"></div>

      <div class="info-box" id="highlights-infobox"></div>
    </div>
  </div>

  <div id="site-footer"></div>
  <script src="assets/data-loader.js"></script>
  <script src="assets/nav-data.js"></script>
  <script src="assets/site.js"></script>
</body>
</html>
