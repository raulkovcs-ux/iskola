<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galéria – Zoltánfy István Iskola</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/site.css">
  <style>
    .gallery-year { margin-bottom: 40px; }
    .gallery-year h2 { margin-bottom: 16px; }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 8px;
    }
    .photo-item {
      margin: 0;
      overflow: hidden;
      border-radius: 8px;
      cursor: zoom-in;
      background: var(--gray-100);
      aspect-ratio: 4/3;
    }
    .photo-item img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      border-radius: 8px;
      transition: transform 0.2s ease, opacity 0.2s;
    }
    .photo-item:hover img { transform: scale(1.04); opacity: 0.92; }

    /* ── Lightbox ── */
    #lightbox {
      display: none;
      position: fixed; inset: 0; z-index: 9000;
      background: rgba(4, 44, 83, 0.92);
      align-items: center; justify-content: center;
      padding: 24px;
    }
    #lightbox.open { display: flex; }
    #lightbox img {
      max-width: min(92vw, 1100px);
      max-height: 88vh;
      object-fit: contain;
      border-radius: 6px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.5);
    }
    #lb-close {
      position: fixed; top: 16px; right: 20px;
      background: none; border: none;
      color: rgba(255,255,255,0.7); font-size: 36px;
      cursor: pointer; line-height: 1; padding: 4px;
    }
    #lb-close:hover { color: #fff; }
    #lb-prev, #lb-next {
      position: fixed; top: 50%; transform: translateY(-50%);
      background: rgba(255,255,255,0.12); border: none;
      color: #fff; font-size: 28px; cursor: pointer;
      padding: 12px 16px; border-radius: 8px;
      transition: background 0.15s;
    }
    #lb-prev { left: 12px; }
    #lb-next { right: 12px; }
    #lb-prev:hover, #lb-next:hover { background: rgba(255,255,255,0.25); }

    @media (max-width: 600px) {
      .photo-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px; }
      #lb-prev, #lb-next { padding: 8px 10px; font-size: 22px; }
    }
  </style>
</head>
<body>

  <div id="site-nav"></div>

    <div class="page-body">

  <!-- Lightbox -->
  <div id="lightbox">
    <button id="lb-close" aria-label="Bezárás">&times;</button>
    <button id="lb-prev" aria-label="Előző">&#8249;</button>
    <img id="lb-img" src="" alt="">
    <button id="lb-next" aria-label="Következő">&#8250;</button>
  </div>

  <div id="site-footer"></div>
  <script src="assets/nav-data.js"></script>
  <script src="assets/site.js"></script>
  <script>
    (function () {
      const lb     = document.getElementById('lightbox');
      const lbImg  = document.getElementById('lb-img');
      const lbClose= document.getElementById('lb-close');
      const lbPrev = document.getElementById('lb-prev');
      const lbNext = document.getElementById('lb-next');

      let items = [];
      let current = 0;

      function open(idx) {
        current = idx;
        lbImg.src = items[current].src;
        lbImg.alt = items[current].alt;
        lb.classList.add('open');
        document.body.style.overflow = 'hidden';
      }
      function close() {
        lb.classList.remove('open');
        document.body.style.overflow = '';
      }
      function prev() { open((current - 1 + items.length) % items.length); }
      function next() { open((current + 1) % items.length); }

      document.querySelectorAll('.photo-item').forEach(function (fig, idx) {
        const img = fig.querySelector('img');
        items.push({ src: img.src, alt: img.alt });
        fig.addEventListener('click', function () { open(idx); });
      });

      lbClose.addEventListener('click', close);
      lbPrev.addEventListener('click', function (e) { e.stopPropagation(); prev(); });
      lbNext.addEventListener('click', function (e) { e.stopPropagation(); next(); });
      lb.addEventListener('click', function (e) { if (e.target === lb) close(); });

      document.addEventListener('keydown', function (e) {
        if (!lb.classList.contains('open')) return;
        if (e.key === 'Escape')      close();
        if (e.key === 'ArrowLeft')   prev();
        if (e.key === 'ArrowRight')  next();
      });
    })();
  </script>
</body>
</html>
