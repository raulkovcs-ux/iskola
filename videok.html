<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Videók – Zoltánfy István Iskola</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/site.css">
  <style>
    .video-year { margin-bottom: 44px; }
    .video-year > h2 { margin-bottom: 16px; }
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }
    .video-card {
      border: 1px solid var(--gray-200);
      border-radius: 12px;
      overflow: hidden;
      background: var(--white);
      transition: box-shadow 0.18s;
    }
    .video-card:hover { box-shadow: 0 6px 24px rgba(4,44,83,0.10); }
    .video-embed {
      position: relative;
      aspect-ratio: 16 / 9;
      background: var(--gray-100);
    }
    .video-embed iframe {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      border: none;
    }
    .video-card-body {
      padding: 14px 16px 16px;
      border-top: 1px solid var(--gray-200);
    }
    .video-card-body h3 {
      font-size: 14px; font-weight: 600;
      color: var(--navy-dark);
      margin: 0 0 2px;
    }
    .video-card-body p {
      font-size: 13px; color: var(--gray-400);
      margin: 0;
    }
    @media (max-width: 600px) {
      .video-grid { grid-template-columns: 1fr; gap: 14px; }
    }
  </style>
</head>
<body>
  <div id="site-topbar"></div>
  <div id="site-nav"></div>

  <div class="page-content">
    <div class="page-header">
      <div class="page-eyebrow">Zoltánfy István Iskola</div>
      <h1>Videók</h1>
      <p class="lead">Iskolánk rendezvényeiről, ünnepségeiről és programjairól készült felvételek.</p>
    </div>
    <div class="page-body">
      <div id="videos-container">
        <p style="color:var(--gray-500);font-style:italic;">Betöltés...</p>
      </div>
    </div>
  </div>

  <div id="site-footer"></div>
  <script src="assets/data-loader.js"></script>
  <script src="assets/nav-data.js"></script>
  <script src="assets/site.js"></script>
</body>
</html>
